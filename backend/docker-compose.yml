services:
  # ─── PostgreSQL Database ───────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: airbnb_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: airbnb_user
      POSTGRES_PASSWORD: airbnb_password
      POSTGRES_DB: airbnb_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airbnb_user -d airbnb_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ─── Alembic Migrations (runs once, then exits) ───────────────────────────
  migrate:
    build:
      context: .
      target: final
    container_name: airbnb_migrate
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://airbnb_user:airbnb_password@db:5432/airbnb_db
    depends_on:
      db:
        condition: service_healthy
    command: alembic upgrade head
    restart: "no"

  # ─── FastAPI Application ───────────────────────────────────────────────────
  app:
    build:
      context: .
      target: final
    container_name: airbnb_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://airbnb_user:airbnb_password@db:5432/airbnb_db
      DEBUG: "True"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
